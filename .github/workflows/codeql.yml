name: CodeQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [healthgo-2.0, main]
  schedule:
    - cron: "20 6 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
