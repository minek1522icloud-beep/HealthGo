name: HealthGo Windows Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: healthgo-windows-release-v2
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/healthgo-2-checks.yml
  release:
    needs: validate
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Ustal automatyczny numer wersji
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $base = (Get-Content package.json | ConvertFrom-Json).version
          $parts = $base.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName'
          $patch = 0
          foreach ($tag in $existing) {
            if ($tag -match "^v$major\.$minor\.(\d+)$") {
              $n = [int]$Matches[1]
              if ($n -gt $patch) { $patch = $n }
            }
          }
          $patch++
          $version = "$major.$minor.$patch"
          npm version $version --no-git-tag-version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Zainstaluj zależności
        run: npm ci
      - name: Zbuduj pakiet HealthGo Cloud AI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop-ai-build" | Out-Null
          Copy-Item "www/healthgo-ai-entry.js" "desktop-ai-build/entry.js"
          Push-Location "desktop-ai-build"
          npm init -y | Out-Null
          npm install --no-package-lock --no-save firebase@12.19.0 esbuild@0.25.10
          npx esbuild entry.js --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=../www/healthgo-ai-bundle.js
          Pop-Location
          if (-not (Test-Path "www/healthgo-ai-bundle.js")) { throw "Brak pakietu HealthGo Cloud AI" }
      - name: Zbuduj instalator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish never
      - name: Sprawdź pliki
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) { throw "Brak latest.yml" }
          if (-not (Get-ChildItem "dist/HealthGo-Setup-*.exe" | Select-Object -First 1)) { throw "Brak instalatora" }
      - name: Opublikuj automatyczne wydanie
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $files = @()
          $files += Get-ChildItem "dist/HealthGo-Setup-*.exe" | ForEach-Object { $_.FullName }
          $files += (Resolve-Path "dist/latest.yml").Path
          $files += Get-ChildItem "dist/*.blockmap" | ForEach-Object { $_.FullName }
          gh release create $tag $files --target "${{ github.sha }}" --title "HealthGo $tag" --notes "Automatyczna aktualizacja HealthGo z gałęzi main. Wersja $version."
