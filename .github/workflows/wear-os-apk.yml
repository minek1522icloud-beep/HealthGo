name: HealthGo Wear OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "watch/wear-os/**"
      - ".github/workflows/wear-os-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Zbuduj APK Wear OS
        working-directory: watch/wear-os
        run: gradle :app:assembleDebug --stacktrace

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthGo-Wear-OS-debug
          path: watch/wear-os/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
