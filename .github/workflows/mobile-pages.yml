name: HealthGo Mobile Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "scripts/build-safe-mobile.py"
      - "scripts/check-syntax.cjs"
      - "tests/build-safe-mobile.test.cjs"
      - "tests/healthgo-map-v2.test.cjs"
      - "tests/healthgo-map-pro.test.cjs"
      - "tests/healthgo-map4.test.cjs"
      - "tests/healthgo-spacious-ui.test.cjs"
      - "tests/healthgo-navigation-screen.test.cjs"
      - "tests/healthgo-navigation-live.test.cjs"
      - "tests/healthgo-navigation-mode.test.cjs"
      - "tests/healthgo-nav-advanced.test.cjs"
      - "tests/healthgo-gps-smooth.test.cjs"
      - "tests/healthgo-auth-resilience.test.cjs"
      - "tests/healthgo-feature-center.test.cjs"
      - "tests/healthgo-map-extras.test.cjs"
      - "www/healthgo-drive-ui.css"
      - "tests/healthgo-chat-modern.test.cjs"
      - "tests/healthgo-unified-2026.test.cjs"
      - "tests/healthgo-photo-badges-v32.test.cjs"
      - "tests/healthgo-original-badges-v28.test.cjs"
      - "tests/healthgo-vector-badges-v29.test.cjs"
      - "tests/healthgo-badge-art-audit-v27.test.cjs"
      - "tests/healthgo-badge-forge-v25.test.cjs"
      - "tests/healthgo-collector-v26.test.cjs"
      - "tests/healthgo-pack-pro.test.cjs"
      - "tests/healthgo-profile-pro.test.cjs"
      - "tests/healthgo-rewards.test.cjs"
      - "tests/ai-multiturn.test.cjs"
      - "tests/mobile-suite.test.cjs"
      - "tests/mobile-update.test.cjs"
      - "tests/healthgo-release-notes.test.cjs"
      - "tests/healthgo-activity44.test.cjs"
      - "tests/healthgo-devices-pro45.test.cjs"
      - "tests/healthgo-device-wizard50.test.cjs"
      - "tests/healthgo-terra51.test.cjs"
      - "www/healthgo-terra50.js"
      - "www/healthgo-terra50.css"
      - "www/healthgo-devices-pro45.js"
      - "supabase/functions/healthgo-terra-link/**"
      - "supabase/functions/healthgo-terra-webhook/**"
      - "supabase/migrations/20261013_healthgo_terra_connections.sql"
      - "tests/device-pairing.test.cjs"
      - "tests/phone-offline-ai.test.cjs"
      - "tests/ai-download-stream.test.cjs"
      - "icon.png"
      - ".github/workflows/mobile-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "healthgo-mobile-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6

      - name: Zbuduj AI do normalnego czatu na telefonie
        shell: bash
        run: |
          mkdir -p mobile-build
          cp www/healthgo-ai-entry.js mobile-build/entry.js
          cd mobile-build
          npm init -y >/dev/null 2>&1
          npm install --no-package-lock --no-save firebase@12.19.0 esbuild@0.25.10
          npx esbuild entry.js --bundle --format=iife --platform=browser --target=es2020 --minify --outfile=../www/healthgo-ai-bundle.js

      - name: Sprawdz pobieranie i wznawianie AI na telefonie
        shell: bash
        run: node --test tests/healthgo-map-recovery.test.cjs tests/healthgo-navigation-live.test.cjs tests/healthgo-navigation-mode.test.cjs tests/healthgo-nav-advanced.test.cjs tests/healthgo-gps-smooth.test.cjs tests/healthgo-auth-resilience.test.cjs tests/google-oauth.test.cjs tests/navigation-follow-v1.test.cjs tests/navigation-arrival-v6.test.cjs tests/healthgo-feature-center.test.cjs tests/healthgo-map-extras.test.cjs tests/healthgo-navigation-screen.test.cjs tests/healthgo-spacious-ui.test.cjs tests/healthgo-map4.test.cjs tests/healthgo-map-pro.test.cjs tests/healthgo-map-v2.test.cjs tests/build-safe-mobile.test.cjs tests/healthgo-chat-modern.test.cjs tests/ai-multiturn.test.cjs tests/mobile-suite.test.cjs tests/mobile-update.test.cjs tests/healthgo-release-notes.test.cjs tests/healthgo-activity44.test.cjs tests/healthgo-devices-pro45.test.cjs tests/healthgo-device-wizard50.test.cjs tests/healthgo-terra51.test.cjs tests/device-pairing.test.cjs tests/phone-offline-ai.test.cjs tests/ai-download-stream.test.cjs

      - name: Sprawdz grafike 240 modeli, proporcje, 3D i zachowanie Plecaka
        shell: bash
        run: |
          node scripts/check-syntax.cjs
          node --test tests/healthgo-unified-2026.test.cjs tests/healthgo-photo-badges-v32.test.cjs tests/healthgo-original-badges-v28.test.cjs tests/healthgo-vector-badges-v29.test.cjs tests/healthgo-badge-art-audit-v27.test.cjs tests/healthgo-badge-forge-v25.test.cjs tests/healthgo-collector-v26.test.cjs tests/healthgo-pack-pro.test.cjs tests/healthgo-profile-pro.test.cjs tests/healthgo-rewards.test.cjs

      - name: Przygotuj wersje mobilna
        shell: bash
        run: |
          cp icon.png www/icon.png
          touch www/.nojekyll
          python3 - <<'PY'
          import os
          from pathlib import Path
          index = Path('www/index.html')
          html = index.read_text(encoding='utf-8')
          original = '<meta name="healthgo-build" content="development">'
          if html.count(original) != 1:
              raise SystemExit('Missing/duplicated HealthGo build marker')
          index.write_text(html.replace(original, '<meta name="healthgo-build" content="' + os.environ['GITHUB_SHA'] + '">'), encoding='utf-8')
          PY
          python3 scripts/build-safe-mobile.py www/index.html www/safe.html
          printf '{"version":"%s","deployedAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > www/version.json
          test -s www/healthgo-ai-bundle.js
          test -s www/healthgo-chat-modern.css
          test -s www/healthgo-map-v2.css
          test -s www/healthgo-map-v2.js
          test -s www/healthgo-map-pro.js
          test -s www/healthgo-map4.js
          test -s www/healthgo-spacious-ui.css
          test -s www/healthgo-navigation-screen.css
          test -s www/healthgo-drive-ui.css
          test -s www/healthgo-gps-visual.js
          test -s www/healthgo-gps-smooth.css
          test -s www/healthgo-nav-advanced.js
          test -s www/healthgo-nav-advanced.css
          test -s www/healthgo-navigation-live.js
          test -s www/healthgo-navigation-live.css
          test -s www/healthgo-route-3d-overlay.js
          test -s www/healthgo-route-3d-overlay.css
          test -s www/healthgo-map-photos.js
          test -s www/healthgo-feature-center.js
          test -s www/healthgo-feature-center.css
          test -s www/healthgo-map-extras.js
          test -s www/healthgo-map-extras.css
          test -s www/safe.html
          test -s www/diagnostics.html
          grep -q 'healthgo-safe-mode' www/safe.html
          grep -q "$GITHUB_SHA" www/index.html
          grep -q "$GITHUB_SHA" www/version.json

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v6

      - name: Wyslij pliki strony
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

      - name: Opublikuj HealthGo Mobile
        id: deployment
        uses: actions/deploy-pages@v4
