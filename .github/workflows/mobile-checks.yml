name: HealthGo Mobile Checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Create CI-only Firebase Android config
        run: |
          cat > mobile/android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "healthgo-ci-only",
              "storage_bucket": "healthgo-ci-only.invalid"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.healthgo.mobile"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key":"CI_ONLY_NOT_A_REAL_FIREBASE_KEY"}],
                "services": {"appinvite_service":{"other_platform_oauth_client":[]}}
              }
            ],
            "configuration_version": "1"
          }
          JSON
      - name: Build and test Android
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HealthGo-Android-review
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build HealthGo for iPhone (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild             -project HealthGoMobile.xcodeproj             -scheme HealthGoMobile             -configuration Debug             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/HealthGoDeviceDerivedData"             SYMROOT="$RUNNER_TEMP/HealthGoBuild"             OBJROOT="$RUNNER_TEMP/HealthGoIntermediates"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build
      - name: Package unsigned iPhone IPA
        working-directory: mobile/ios
        run: |
          rm -rf HealthGoIpa HealthGo-unsigned.ipa
          mkdir -p HealthGoIpa/Payload
          cp -R "$RUNNER_TEMP/HealthGoBuild/Debug-iphoneos/HealthGoMobile.app" HealthGoIpa/Payload/
          (cd HealthGoIpa && zip -qry ../HealthGo-unsigned.ipa Payload)
          test -s HealthGo-unsigned.ipa
      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: HealthGo-iPhone-unsigned
          path: mobile/ios/HealthGo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Build HealthGo for iPhone Simulator
        working-directory: mobile/ios
        run: |
          xcodebuild             -project HealthGoMobile.xcodeproj             -scheme HealthGoMobile             -configuration Debug             -destination 'generic/platform=iOS Simulator'             -derivedDataPath "$RUNNER_TEMP/HealthGoSimulatorDerivedData"             SYMROOT="$RUNNER_TEMP/HealthGoSimBuild"             OBJROOT="$RUNNER_TEMP/HealthGoIntermediates"             CODE_SIGNING_ALLOWED=NO             build
      - name: Validate Supabase + HealthKit integration
        run: |
          grep -q "HealthKit" mobile/ios/HealthGoMobile/HealthSync.swift
          grep -q "oqrfapmdcofguwdvhbeo.supabase.co" mobile/ios/HealthGoMobile/HealthGoSession.swift
          grep -q "activity_daily" mobile/ios/HealthGoMobile/HealthSync.swift
          grep -q "heart_rate" mobile/ios/HealthGoMobile/HealthSync.swift
          grep -q "loginGoogle" mobile/ios/HealthGoMobile/HealthGoSession.swift
          grep -q "healthgo_register_device" mobile/ios/HealthGoMobile/HealthSync.swift
          grep -q "healthgo://auth-callback" www/mobile-oauth-callback.html
