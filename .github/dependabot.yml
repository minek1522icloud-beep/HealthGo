      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /firebase/functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /mobile/android
