name: HealthGoMobile
options:
  bundleIdPrefix: com.healthgo
targets:
  HealthGoMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [HealthGoMobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthgo.HealthGoMobile
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
    entitlements:
      path: HealthGoMobile/HealthGoMobile.entitlements
    info:
      path: HealthGoMobile/Info.plist
