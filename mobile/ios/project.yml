name: HealthGoMobile
options:
  bundleIdPrefix: com.healthgo
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
targets:
  HealthGoMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [HealthGoMobile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.healthgo.HealthGoMobile
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
    entitlements:
      path: HealthGoMobile/HealthGoMobile.entitlements
    info:
      path: HealthGoMobile/Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
