<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealthGo — logowanie</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111827}
main{max-width:420px;padding:28px;text-align:center}h1{font-size:24px}p{color:#6b7280;line-height:1.5}
</style>
</head>
<body>
<main><h1>❤️ HealthGo</h1><p id="status">Wracam do aplikacji HealthGo…</p></main>
<script>
(function(){
 const p=new URLSearchParams(location.search);
 const target=new URL('healthgo://auth-callback');
 ['code','error','error_description'].forEach(k=>{if(p.has(k))target.searchParams.set(k,p.get(k));});
 location.replace(target.toString());
 setTimeout(()=>{const s=document.getElementById('status');if(s)s.textContent='Jeśli aplikacja nie otworzyła się automatycznie, wróć do HealthGo i spróbuj ponownie.';},1800);
})();
</script>
</body>
</html>
